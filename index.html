<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gon&ccedil;ales Ve&iacute;culos | Cat&aacute;logo</title>
  <meta name="description" content="Cat&aacute;logo de ve&iacute;culos da Gon&ccedil;ales Ve&iacute;culos.">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Gon&ccedil;ales Ve&iacute;culos">
      <span class="brand-logo">
        <img src="assets/logo-header.png" alt="Logo Gon&ccedil;ales Ve&iacute;culos">
      </span>
      <span>Gon&ccedil;ales Ve&iacute;culos</span>
    </a>
  </header>

  <main class="catalog-shell">
    <aside class="catalog-panel" aria-label="Filtros do cat&aacute;logo">
      <div class="panel-mark">
        <span>Estoque premium</span>
        <strong id="catalogTotal">0 carros</strong>
      </div>

      <div class="filter-stack">
        <label class="field">
          <span>Buscar</span>
          <input id="searchInput" type="search" placeholder="Modelo, vers&atilde;o, cor">
        </label>

        <label class="field">
          <span>Combust&iacute;vel</span>
          <select id="fuelFilter">
            <option value="">Todos</option>
          </select>
        </label>

        <label class="field">
          <span>C&acirc;mbio</span>
          <select id="transmissionFilter">
            <option value="">Todos</option>
          </select>
        </label>

        <label class="field">
          <span>Ordenar</span>
          <select id="sortSelect">
            <option value="featured">Destaques</option>
            <option value="priceAsc">Menor valor</option>
            <option value="priceDesc">Maior valor</option>
            <option value="yearDesc">Mais novo</option>
          </select>
        </label>
      </div>
    </aside>

    <section class="catalog-view" aria-label="Cat&aacute;logo de ve&iacute;culos">
      <div class="catalog-heading">
        <p>Novidades selecionadas</p>
        <h1>&Uacute;ltimas novidades</h1>
      </div>

      <div class="catalog-toolbar">
        <span id="resultSummary">Carregando estoque</span>
        <button id="clearFilters" class="quiet-button" type="button">Limpar filtros</button>
      </div>

      <div id="catalogGrid" class="vehicle-grid"></div>

      <div id="emptyState" class="empty-state" hidden>
        <strong>Nenhum ve&iacute;culo encontrado</strong>
        <span>Ajuste os filtros para ver outras op&ccedil;&otilde;es do estoque.</span>
      </div>
    </section>
  </main>

  <dialog id="detailsDialog" class="details-dialog">
    <div id="detailsContent"></div>
  </dialog>

  <nav class="mobile-contact-bar" aria-label="Contato r&aacute;pido">
    <a id="mobileInstagramLink" class="contact-action instagram" href="#catalogGrid" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.2" cy="6.8" r="1"></circle>
      </svg>
    </a>
    <a id="mobilePhoneLink" class="contact-action phone is-disabled" href="#catalogGrid" aria-label="Ligar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.7 19.7 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.7 19.7 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7A2 2 0 0 1 22 16.9z"></path>
      </svg>
    </a>
    <a id="mobileWhatsappLink" class="contact-action whatsapp" href="https://api.whatsapp.com/send" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 11.8a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.3-4.8a8.5 8.5 0 1 1 16.2-3.9z"></path>
        <path d="M8.8 8.4c.2-.5.4-.5.7-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.4.5c-.2.2-.2.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.1.6-.1l.6-.7c.2-.2.4-.2.7-.1l1.6.8c.3.1.4.3.4.6 0 .6-.4 1.4-.9 1.6-.7.3-1.6.3-3-.3-2.6-1.1-4.3-3.6-4.5-3.9-.1-.2-1.1-1.5-1.1-2.8 0-.7.4-1.2.6-1.5z"></path>
      </svg>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
